<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<title>Rajiv Jha — Building at the intersection of software and intelligence</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090D19"/><stop offset="1" stop-color="#17192F"/></linearGradient><radialGradient id="glow"><stop stop-color="#7561DB" stop-opacity=".3"/><stop offset="1" stop-color="#7561DB" stop-opacity="0"/></radialGradient><linearGradient id="line"><stop stop-color="#61E4CC"/><stop offset="1" stop-color="#B49BFF"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#B7C5FF" stroke-opacity=".045"/></pattern></defs>
<style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes drift{50%{transform:translateY(-10px)}}.orbit{transform-origin:940px 213px;animation:spin 38s linear infinite}.float{animation:drift 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse{animation:none}}</style>
<rect width="1200" height="440" rx="20" fill="url(#bg)"/><rect width="1200" height="440" rx="20" fill="url(#grid)"/><ellipse cx="970" cy="210" rx="300" ry="260" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#31334F"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="54" y="54" font-size="14" letter-spacing="4" fill="#C1C7DD">RAJIV JHA</text><circle class="pulse" cx="977" cy="49" r="4" fill="#76E5C4"/><text x="990" y="54" font-size="11" letter-spacing="2" fill="#A9B6CE">LEARN · BUILD · REFINE</text>
<text x="54" y="125" font-family="monospace" font-size="13" fill="#8B93B2">COMPUTER SCIENCE / ASPIRING AI &amp; ML ENGINEER</text>
<text x="50" y="196" font-size="61" font-weight="700" letter-spacing="-2" fill="#F4F3FC">Curiosity into code.</text>
<text x="50" y="265" font-size="61" font-weight="700" letter-spacing="-2" fill="url(#line)">Code into possibility.</text>
<text x="54" y="309" font-size="17" fill="#ACB4CF">Exploring data. Building applications. Understanding what connects them.</text>
