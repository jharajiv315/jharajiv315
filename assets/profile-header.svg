<text x="54" y="394" font-family="monospace" font-size="12" letter-spacing="1" fill="#C4CAE0">MUMBAI, INDIA</text><text x="270" y="394" font-family="monospace" font-size="12" letter-spacing="1" fill="#C4CAE0">B.TECH · 2029</text><text x="493" y="394" font-family="monospace" font-size="12" letter-spacing="1" fill="#C4CAE0">2× HACKATHON FINALIST</text><text x="1000" y="394" font-family="monospace" font-size="12" fill="#8D97BC">RJ / NOTEBOOK</text></g>
